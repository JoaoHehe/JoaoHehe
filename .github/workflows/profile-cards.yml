
name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar estatísticas
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: JoaoHehe
          output-dir: profile
          themes: dark
          cards: overview,lifetime,contributions,composition,rhythm,languages
          commit: true
          commit-message: "Atualizar estatísticas do perfil"
